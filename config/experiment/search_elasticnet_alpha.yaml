# @package _global_
defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

# モード設定
optimization_direction: maximize
optimization_metric: ic

preprocess:
  sampling:
    enabled: false
  target_stratified_sampling:
    enabled: true
    mode: mode_3
    weight_dict: {'tail': 3.0, 'center': 0.1, 'other': 1.0}

model:
  name: ElasticNet
  model_target: src.models.elasticnet_wrapper.ElasticNetWrapper 
  data_category: tabular

hparams:
  max_iter: 1000
  random_state: 42
  use_time_decay: false
  # 探索対象となる可能性のあるパラメータのプレースホルダ
  # これらを定義しておくことで、Optuna Sweeper による Override が可能になります
  asym_alpha: 3.0
  asym_beta: 1.0
  fair_c: 10.0
  quantile: 0.5
  tweedie_variance_power: 1.5
