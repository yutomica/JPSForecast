# config/main.yaml
defaults:
  - _self_
  - domain: tac
  - target: tac_alpha_gr
  - data: sample
  - features: all
  - model: lgbm
  - hparams: target_probe
  - period: tac_standard
  - cv: fixed
  - sweep: null
  - mode: null
  - experiment: null

# ターゲット層化サンプリングのデフォルト設定
preprocess:
  sampling:
    enabled: false
    interval: 5
  target_stratified_sampling:
    enabled: false
    mode: mode_1
    center_keep_ratio: 0.25
  matrix_weight:
    enabled: false
    cost_buffer: 0.002
  class_weight:
    enabled: false
  hard_negative_weighting:
    enabled: false

# MLflow設定
mlflow:
  tracking_uri: "sqlite:////Users/yuu/Projects/JPSForecast/mlflow.db"
  experiment_name: "test"

# 実験バリアント識別子
variant: "default"
