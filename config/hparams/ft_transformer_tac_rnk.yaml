d_token: 64
n_blocks: 3
attention_n_heads: 4
attention_dropout: 0.2
ffn_hidden_multiplier: 2.0
ffn_dropout: 0.2
residual_dropout: 0.1
head_dropout: 0.1

max_epochs: 30
patience: 5
batch_size: 512
random_state: 42
device_name: "cpu"

lr: 0.0001
weight_decay: 0.01
grad_clip_norm: 1.0

use_time_decay: true
time_decay_rate: 0.9999