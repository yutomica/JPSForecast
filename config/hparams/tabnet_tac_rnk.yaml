n_d: 8
n_a: 24
n_steps: 5
gamma: 1.2
lambda_sparse: 3.5e-05
n_independent: 2  
n_shared: 2      
momentum: 0.08   
optimizer_fn: "adam"
optimizer_params:
  lr: 0.002
  weight_decay: 1e-5
mask_type: "entmax"
scheduler_params:
  step_size: 50
  gamma: 0.9
scheduler_fn: "step"
random_state: 42
use_pretrain: False
use_time_decay: False

max_epochs: 100
patience: 3
batch_size: 1024
n_trials: 30
device_name: "cpu"  # Use "cpu" if GPU is not available