# GANDALF Hyperparameters (Financial ML Baseline)
learning_rate: 1.0e-4
weight_decay: 0.001
batch_size: 4096
max_epochs: 150
patience: 30
gflu_stages: 6
gflu_dropout: 0.1
gflu_feature_init_sparsity: 0.3
learnable_sparsity: True
head_hidden_dims: [128, 64]
head_dropout: 0.2
gradient_clip_val: 1.0
lr_decay_factor: 0.5
lr_patience: 5
min_lr: 1e-06
early_stopping_ema_alpha: 0.1
random_state: 42
num_workers: 0
use_time_decay: false
time_decay_rate: 0.9999
