# config/cv/anchored_walk_forward.yaml
_target_: src.cv.anchored_walk_forward.AnchoredWalkForwardPurgedCV

# 例: 最初の252営業日で学習し、その後63営業日ごとに検証
n_splits: 5
min_train_size: 252
val_size: 252
step_size: 252

# None のままなら真の Anchored Expanding Window
max_train_size: null

# Anchored WFV では classic embargo は未来側trainが無いため効きにくい。
# ここでは validation 直前ギャップとして扱う。
pct_embargo: 0.0

# 末尾が val_size 未満でも最後のfoldを使いたい場合のみ true
allow_incomplete_last_fold: false
