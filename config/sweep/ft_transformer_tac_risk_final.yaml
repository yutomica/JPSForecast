# @package _global_
# Step 4: TAC Alpha 最終HPO (Bayesian Optimization)
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      multivariate: true
      n_startup_trials: 10
    storage: "sqlite:///optuna.db"
    direction: maximize
    n_trials: 30
    params:
      hparams.lr: tag(log, interval(5e-5, 5e-4))
      hparams.weight_decay: tag(log, interval(1e-7, 1e-3))
      hparams.alpha: interval(0.08, 0.16)
      hparams.attention_dropout: interval(0.1, 0.4)
      hparams.ffn_dropout: interval(0.2, 0.6)
      hparams.residual_dropout: interval(0.0, 0.3)
