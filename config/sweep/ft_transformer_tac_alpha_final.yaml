# @package _global_
# Step 4: TAC Alpha 最終HPO (Bayesian Optimization)
defaults:
  - override /hydra/sweeper: optuna
target:
  optimization_metric: "ndgc_10"
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      multivariate: true
      n_startup_trials: 10
    storage: "sqlite:///optuna.db"
    direction: maximize
    n_trials: 30
    params:
      hparams.lr: tag(log, interval(1e-4, 1e-3))
      hparams.weight_decay: tag(log, interval(1e-6, 1e-3))
      hparams.asym_alpha: interval(3.0, 7.0)
      hparams.attention_dropout: interval(0.1, 0.4)
      hparams.ffn_dropout: interval(0.1, 0.5)
      hparams.residual_dropout: interval(0.0, 0.3)
