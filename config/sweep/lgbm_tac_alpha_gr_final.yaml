# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 36
    params:
      hparams.feature_fraction: interval(0.1, 0.35)
      hparams.bagging_fraction: interval(0.75, 0.95)
      hparams.lambda_l1: tag(log, interval(0.01, 10.0))
      hparams.lambda_l2: tag(log, interval(0.01, 10.0))
      hparams.asym_alpha: interval(2.5, 4.0)
      hparams.verbose: -1
