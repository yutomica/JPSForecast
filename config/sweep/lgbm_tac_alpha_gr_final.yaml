# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 72
    params:
      # ---- Step4 HPO search space ----
      hparams.learning_rate: tag(log, interval(0.02, 0.055))
      hparams.feature_fraction: interval(0.3, 0.6)
      hparams.bagging_fraction: interval(0.62, 0.78)
      hparams.lambda_l1: interval(0.5, 6.0)
      hparams.lambda_l2: tag(log, interval(3.0, 18.0))
      +hparams.min_split_gain: interval(0.05, 0.18)
      +hparams.alpha: interval(1.10, 1.55)
      hparams.verbose: -1