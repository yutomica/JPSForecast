# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 36
    params:
      # ---- Step4 HPO search space ----
      hparams.learning_rate: tag(log, interval(0.012, 0.050))
      hparams.feature_fraction: interval(0.20, 0.62)
      hparams.bagging_fraction: interval(0.54, 0.78)
      hparams.lambda_l1: interval(2.0, 10.0)
      hparams.lambda_l2: tag(log, interval(3.0, 30.0))
      +hparams.min_split_gain: interval(0.0, 0.18)
      +hparams.alpha: interval(0.85, 1.50)
      hparams.verbose: -1
