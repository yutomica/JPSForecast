# @package _global_
# Step4 final HPO search space for TAC triple-barrier +7/-4 target.
# Anchor tree shape is fixed by config/hparams/anchor/lgbm_tac_tb_7_4.yaml:
# num_leaves=15, max_depth=4, min_child_samples=1000.
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 16
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 48
    params:
      # Binary triple-barrier event: keep probabilities reasonably calibrated
      # while maximizing top-ranked hit concentration.
      hparams.learning_rate: tag(log, interval(0.004, 0.025))
      hparams.feature_fraction: interval(0.55, 0.95)
      hparams.bagging_fraction: interval(0.65, 0.95)
      hparams.lambda_l1: tag(log, interval(0.05, 20.0))
      hparams.lambda_l2: tag(log, interval(0.5, 60.0))
      +hparams.min_split_gain: interval(0.0, 0.25)
      +hparams.scale_pos_weight: interval(2.0, 5.0)
      hparams.is_unbalance: false
      hparams.verbose: -1
