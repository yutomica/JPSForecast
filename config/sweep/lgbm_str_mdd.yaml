# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize  # Sharpe Ratioなどを最大化
    storage: "sqlite:///optuna.db"
    n_trials: 100       # 最適化のため試行回数を増加
    params:
      # 探索空間を広く定義し、ベイズ最適化（TPE）を適用
      hparams.feature_fraction: interval(0.2, 0.7)
      hparams.lambda_l1: tag(log, interval(0.5, 15.0))
      hparams.lambda_l2: tag(log, interval(0.1, 10.0))
      hparams.tweedie_variance_power: interval(1.1, 1.9)
      # 固定値
      hparams.verbose: -1