# @package _global_
# Step 2: TAC Alpha (FT-Transformer) ラフチューニング
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: src.utils.samplers.HydraBruteForceSampler
    storage: "sqlite:///optuna.db"
    direction: maximize
    n_trials: 12
    params:
      # アンカー(岩盤)パラメータの探索: 3 * 2 * 2 = 12 通り
      ++hparams.d_token: choice(16, 32, 64)
      ++hparams.n_blocks: choice(2, 3)
      ++hparams.attention_dropout: choice(0.2, 0.3)
      
      # 理論に基づく固定パラメータ
      ++hparams.lr: 0.0001
      ++hparams.attention_n_heads: 2
