# @package _global_
# ElasticNet TAC Alpha スイープ
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 50
    params:
      hparams.l1_ratio: interval(0.5, 1.0)
      hparams.alpha: tag(log, interval(1e-5, 1e-2))
      ++hparams.asym_alpha: interval(3.5, 6.0)
