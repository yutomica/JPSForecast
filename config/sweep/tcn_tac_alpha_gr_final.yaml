# @package _global_
# Step 2: TAC Alpha (TCN) ラフチューニング
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 30
    params:
      hparams.learning_rate: tag(log, interval(8.0e-4, 5.0e-3))
      hparams.weight_decay: tag(log, interval(1.0e-7, 1.0e-4))
      hparams.dropout: interval(0.22, 0.42)
      +hparams.alpha: interval(1.3, 1.7)
