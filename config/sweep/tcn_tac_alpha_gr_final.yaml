# @package _global_
# Step 2: TAC Alpha (TCN) ラフチューニング
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 36
    params:
      hparams.learning_rate: tag(log, interval(7.0e-4, 4.0e-3))
      hparams.weight_decay: tag(log, interval(1.0e-8, 3.0e-5))
      hparams.dropout: interval(0.1, 0.34)
      +hparams.huber_beta: interval(0.5, 2.0)
       +hparams.grad_clip_norm: interval(0.50, 2.00)
