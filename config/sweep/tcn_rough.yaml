# @package _global_
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: maximize  # ランクICやリスク調整後リターンの最大化
    n_trials: 40
    params:
      # 1. 学習率（CNN系は勾配爆発/消失が起きやすいため、対数スケールで慎重に）
      hparams.learning_rate: tag(log, interval(0.0001, 0.01))
      # 2. モデルの幅（チャネル数）：8GB RAMではここが最大のボトルネック
      # 130個の特徴量を集約するため、16〜64の範囲で十分機能する
      hparams.num_channels: choice(16, 32, 64)
      # 3. 受容野の設計（カーネルサイズと階層数）
      # 金融時系列の局所パターンを捉えるために3または5が標準的
      hparams.kernel_size: choice(2, 3, 5)
      hparams.n_layers: int(range(2, 5)) # ネットワークの深さ
      # 4. 正則化（金融MLの生命線：DropoutとWeight Decay）
      # TCNは過学習しやすいため、高めのDropout率を探索範囲に含める
      hparams.dropout: interval(0.1, 0.5)
      hparams.weight_decay: tag(log, interval(1e-5, 1e-2))
      # 5. 膨張係数のベース（通常は2で固定されるが、稀に探索対象とする）
      hparams.dilation_base: choice(2)
      hparams.gradient_clip_val: choice(0.1, 0.5)
      # 6. バッチサイズ
      hparams.batch_size: choice(512, 1024)