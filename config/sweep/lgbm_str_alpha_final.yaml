# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20
      multivariate: true
    direction: maximize  # Sharpe Ratioなどを最大化
    storage: "sqlite:///optuna.db"
    n_trials: 100       # 最適化のため試行回数を増加
    params:
      # 探索空間を広く定義し、ベイズ最適化（TPE）を適用
      hparams.feature_fraction: interval(0.45, 0.7)
      hparams.bagging_fraction: interval(0.72, 0.96)
      hparams.lambda_l1: tag(log, interval(1.0e-5, 0.3))
      hparams.lambda_l2: tag(log, interval(1.0e-2, 30.0))
      ++hparams.alpha: interval(0.35, 1.25)
      hparams.learning_rate: interval(0.01, 0.03)
      # 固定値
      hparams.verbose: -1