# @package _global_
defaults:
  - override /hydra/sweeper: optuna
target:
  optimization_metric: "ndgc_10"
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20
      multivariate: true
    direction: maximize  # Sharpe Ratioなどを最大化
    storage: "sqlite:///optuna.db"
    n_trials: 50       # 最適化のため試行回数を増加
    params:
      # ++hparams.alpha: interval(2.0, 5.0)
      ++hparams.alpha: interval(3.0, 8.0)
      # hparams.dropout: interval(0.05, 0.25)
      hparams.dropout: interval(0.1, 0.4)
      hparams.weight_decay: tag(log,interval(1e-6, 1e-3))
      hparams.lr: tag(log, interval(1e-4, 1e-3))