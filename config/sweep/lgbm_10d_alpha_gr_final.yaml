# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 81
    params:
      # ---- Step4 HPO search space ----
      hparams.learning_rate: tag(log, interval(0.009, 0.017))
      hparams.feature_fraction: interval(0.6, 0.82)
      hparams.bagging_fraction: interval(0.75, 0.98)
      hparams.lambda_l1: tag(log, interval(2.0, 20.0))
      hparams.lambda_l2: tag(log, interval(0.8, 50.0))
      +hparams.alpha: interval(0.6, 1.25)
      hparams.verbose: -1