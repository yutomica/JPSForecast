# @package _global_
defaults:
  - override /hydra/sweeper: optuna
target:
  optimization_metric: "AP_severe"
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20
      multivariate: true
    direction: maximize  # Sharpe Ratioなどを最大化
    storage: "sqlite:///optuna.db"
    n_trials: 50       # 最適化のため試行回数を増加
    params:
      ++hparams.alpha: interval(0.05, 0.13)
      hparams.dropout: interval(0.10, 0.35)
      hparams.weight_decay: tag(log,interval(1e-8, 1e-3))
      hparams.lr: tag(log, interval(5e-5, 3e-4))