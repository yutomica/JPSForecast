# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    # Optunaの設定
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      multivariate: true
    direction: maximize  # Sharpe Ratioなどを最大化
    n_trials: 30       # 最適化のため試行回数を増加
    params:
      # 探索空間を広く定義し、ベイズ最適化（TPE）を適用
      hparams.lr: tag(log, interval(1e-5, 5e-4))
      hparams.attention_dropout: interval(0.1, 0.4)
      hparams.ffn_dropout: interval(0.1, 0.4)
      hparams.residual_dropout: interval(0.0, 0.2)
      hparams.weight_decay: tag(log, interval(1e-6, 1e-3))