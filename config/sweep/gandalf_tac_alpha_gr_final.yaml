# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 36
    params:
      # ---- Step4 HPO search space ----
      hparams.gflu_feature_init_sparsity: interval(0.20, 0.40)
      hparams.learning_rate: tag(log, interval(3.0e-4, 1.2e-3))
      hparams.weight_decay: tag(log, interval(1.0e-8, 3.0e-5))
      hparams.head_dropout: interval(0.16, 0.36)
      hparams.gflu_dropout: interval(0.08, 0.18)
      +hparams.alpha: interval(0.70, 2.10)
