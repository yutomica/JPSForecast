# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 15
      multivariate: true
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 72
    params:
      # ---- Step4 HPO search space ----
      hparams.learning_rate: tag(log, interval(4.5e-4, 8.0e-4))
      hparams.weight_decay: choice(0.0, 1.0e-7, 3.0e-7, 1.0e-6, 3.0e-6, 1.0e-5)
      hparams.head_dropout: interval(0.12, 0.3)
      hparams.gflu_dropout: interval(0.07, 0.13)
      +hparams.alpha: choice(0.75, 1.0, 1.25, 1.5, 1.75, 2.0)