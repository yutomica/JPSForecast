# @package _global_
# ElasticNet STR Risk スイープ
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      multivariate: true
      n_startup_trials: 30
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 50
    params:
      hparams.l1_ratio: interval(0.0, 0.5)
      hparams.alpha: tag(log, interval(0.0001, 1000.0))
      ++hparams.tweedie_variance_power: interval(1.1, 1.9)
