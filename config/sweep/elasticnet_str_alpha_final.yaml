# @package _global_
# ElasticNet STR Alpha スイープ
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      multivariate: true
      n_startup_trials: 30
    direction: maximize
    storage: "sqlite:///optuna.db"
    n_trials: 50
    params:
      hparams.l1_ratio: interval(0.5, 1.0)
      hparams.alpha: tag(log, interval(0.00001, 1.0))
      # ++hparams.fair_c: interval(8.0, 15.0)
      ++hparams.fair_c: interval(3.0, 10.0)
