# @package _global_
defaults:
  - override /hydra/sweeper: optuna
hydra:
  sweeper:
    n_jobs: 4
    sampler:
      _target_: src.utils.samplers.HydraBruteForceSampler
    storage: "sqlite:///optuna.db"
    n_trials: 64
    params:
      # ======================================================
      # 【探索対象】 木構造の骨格（アンカーパラメータ）
      # ======================================================
      hparams.max_depth: choice(2,3,4,5)
      hparams.num_leaves: choice(3,7,15,31)
      # hparams.min_child_samples: choice(1000,2000,4000,8000)
      # ======================================================
      # 【固定対象】 Step 2では探索せず固定するパラメータ
      # ======================================================
      # 学習速度を優先し、やや高めに固定（Step 4のHPOで 0.01 などに下げる）
      hparams.learning_rate: 0.05 
      hparams.feature_fraction: 0.8
      hparams.bagging_fraction: 0.8
      hparams.bagging_freq: 5
      hparams.lambda_l1: 1.0
      hparams.lambda_l2: 1.0
      hparams.min_split_gain: 0.1
      hparams.verbose: -1
hparams:
  num_threads: 4