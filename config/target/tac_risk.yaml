# @package _global_
target:
  name: "tac_risk"
  column: "target_tac_risk_class"   # データセット内のどの列をターゲットにするか
  task_type: "multiclass"        # 回帰(continuous)か分類(binary/multiclass)か
  prediction_horizon: 5       # 何日先を予測するか（5日後など）

  # コスト関数
  objective: "multiclass"

#   # 監視指標
#   early_stopping_metric: src.models.custom_metrics.calc_ap_severe
#   metric_direction: maximize

#   # 評価関数
#   eval_metric: "AP_severe"

#   # 最適化指標 (Step4 Final Sweep向けに guarded_ap を指定)
#   optimization_metric: "tac_risk_class_guarded_ap"

